services:
  postgres:
    image: postgres:16-alpine
    container_name: frannys-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: frannys
      POSTGRES_PASSWORD: frannys
      POSTGRES_DB: frannys
    volumes:
      - frannys_pg_data:/var/lib/postgresql/data

volumes:
  frannys_pg_data:
